<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel - Kotelna</title>
    <!-- Odkaz na sdílený CSS soubor -->
    <link rel="stylesheet" href="style.css">
    
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <!-- Knihovny pro graf -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.3.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1"></script>

    <style>
        /* Specifické styly pro ovládání grafu */
        .chart-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .range-btn {
            background-color: #ecf0f1;
            border: 1px solid #bdc3c7;
            color: #2c3e50;
            padding: 5px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .range-btn:hover {
            background-color: #dfe6e9;
            transform: translateY(-1px);
        }

        .range-btn.active {
            background-color: #3498db;
            color: white;
            border-color: #3498db;
            box-shadow: 0 2px 5px rgba(52, 152, 219, 0.3);
        }

        /* Styly pro přepínače křivek (filtr dat) */
        .toggle-btn {
            padding: 4px 12px;
            border-radius: 15px;
            border: 2px solid;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            transition: all 0.2s;
            background-color: transparent;
        }
        .toggle-btn:hover {
            transform: scale(1.05);
        }

        /* Styly pro vlastní vstup hodin */
        .range-input {
            border: 1px solid #bdc3c7;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.9rem;
            width: 70px;
            outline: none;
            color: #2c3e50;
            text-align: center;
        }
        .range-input:focus {
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }
    </style>
</head>
<body>

    <!-- NAVIGACE -->
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">Monitorovací Systém</a>
        <div class="nav-links">
            <a href="teplomer.html" class="nav-btn">Místnosti</a>
            <a href="kotelna.html" class="nav-btn active">Kotelna</a>
        </div>
    </nav>

    <div class="container">
        <div id="status">Připojování k MQTT...</div>
        <br>

        <!-- GRID PRO KOTELNU (Živá data) -->
        <div class="dashboard-grid">
                
            <!-- Karta: Kotel -->
            <div class="card card-boiler">
                <span class="card-icon">🔥</span>
                <h2>Hlavní Kotel</h2>
                <div class="data-row">
                    <span class="data-label">Teplota Pece</span>
                    <div>
                        <span id="val-pec" class="data-value">--</span> <span class="data-unit">°C</span>
                    </div>
                </div>
            </div>

            <!-- Karta: Nový Bojler -->
            <div class="card">
                <span class="card-icon">💧</span>
                <h2>Nový Bojler</h2>
                <div class="data-row">
                    <span class="data-label">Horní</span>
                    <div><span id="val-horni_n" class="data-value">--</span> <span class="data-unit">°C</span></div>
                </div>
                <div class="data-row">
                    <span class="data-label">Střední</span>
                    <div><span id="val-stredni_n" class="data-value">--</span> <span class="data-unit">°C</span></div>
                </div>
                <div class="data-row">
                    <span class="data-label">Dolní</span>
                    <div><span id="val-dolni_n" class="data-value">--</span> <span class="data-unit">°C</span></div>
                </div>
            </div>

            <!-- Karta: Starý Bojler -->
            <div class="card card-old">
                <span class="card-icon">🏚️</span>
                <h2>Starý Bojler</h2>
                <div class="data-row">
                    <span class="data-label">Horní</span>
                    <div><span id="val-horni_s" class="data-value">--</span> <span class="data-unit">°C</span></div>
                </div>
                <div class="data-row">
                    <span class="data-label">Dolní</span>
                    <div><span id="val-dolni_s" class="data-value">--</span> <span class="data-unit">°C</span></div>
                </div>
            </div>

            <!-- Karta: Solární Panel -->
            <div class="card card-solar">
                <span class="card-icon">☀️</span>
                <h2>Solární Panel</h2>
                <div class="data-row">
                    <span class="data-label">Teplota kolektoru</span>
                    <div>
                        <span id="val-solarni" class="data-value">--</span> <span class="data-unit">°C</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- Sekce pro Graf -->
        <div class="chart-container" style="height: auto; padding-bottom: 30px;">
            
            <!-- Přepínače zobrazených hodnot v grafu -->
            <div id="dataset-toggles" class="chart-controls" style="margin-bottom: 20px;">
                <!-- Tlačítka se vygenerují automaticky přes JS -->
            </div>

            <!-- Ovládací tlačítka pro časové období (předáváme počet hodin) -->
            <div class="chart-controls" style="align-items: center;">
                <button onclick="changeRange(6, this)" class="range-btn">6h</button>
                <button onclick="changeRange(12, this)" class="range-btn">12h</button>
                <button onclick="changeRange(24, this)" class="range-btn active">24h</button>
                <button onclick="changeRange(72, this)" class="range-btn">3 Dny</button>
                <span style="color: #bdc3c7; margin: 0 5px;">|</span>
                <input type="number" id="custom-hours" class="range-input" placeholder="Hodin..." min="1" max="720">
                <button onclick="applyCustomRange(this)" class="range-btn">Použít</button>
            </div>
            
            <div style="position: relative; height: 340px;"> 
                <canvas id="kotelnaChart"></canvas>
            </div>
        </div>

    </div>

    <script>
        // --- 1. KONFIGURACE THINGSPEAK ---
        const tsConfig = {
            channelID: '3229890', 
            readKey: 'WB281UEYF211LC92'
        };

        // --- 2. DEFINICE DAT PRO GRAF ---
        const datasetsConfig = [
            { field: 'field1', label: 'Pec', color: '#e74c3c' },
            { field: 'field2', label: 'Bojler N-Horní', color: '#3498db' },
            { field: 'field3', label: 'Bojler N-Střed', color: '#5dade2' },
            { field: 'field4', label: 'Bojler N-Dolní', color: '#85c1e9' },
            { field: 'field5', label: 'Bojler S-Horní', color: '#7f8c8d' },
            { field: 'field6', label: 'Bojler S-Dolní', color: '#bdc3c7' },
            { field: 'field7', label: 'Solár', color: '#f39c12' }
        ];

        // --- 3. INICIALIZACE GRAFU A PŘEPÍNAČŮ ---
        const ctx = document.getElementById('kotelnaChart').getContext('2d');
        const chartData = {
            datasets: datasetsConfig.map(ds => ({
                label: ds.label,
                borderColor: ds.color,
                backgroundColor: ds.color,
                data: [], 
                tension: 0.3,
                borderWidth: 2,
                pointRadius: 0,
                pointHitRadius: 10
            }))
        };

        const myChart = new Chart(ctx, {
            type: 'line',
            data: chartData,
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { 
                        type: 'time', 
                        time: { unit: 'hour', tooltipFormat: 'dd.MM. yyyy HH:mm' }, 
                        title: {display: true, text: 'Čas'} 
                        // min a max se budou nastavovat dynamicky podle vybraného času
                    },
                    y: { title: {display: true, text: 'Teplota (°C)'} }
                },
                plugins: {
                    title: { display: true, text: 'Historie teplot v kotelně' },
                    tooltip: { mode: 'index', intersect: false },
                    legend: { display: false } // Vypneme výchozí legendu, máme vlastní tlačítka
                }
            }
        });

        // Generování tlačítek pro filtrování dat
        const togglesContainer = document.getElementById('dataset-toggles');
        datasetsConfig.forEach((ds, index) => {
            const btn = document.createElement('button');
            btn.className = 'toggle-btn';
            // Výchozí stav (vše zapnuto)
            btn.style.borderColor = ds.color;
            btn.style.backgroundColor = ds.color;
            btn.style.color = 'white';
            btn.innerText = ds.label;
            
            btn.onclick = () => {
                const isCurrentlyVisible = myChart.isDatasetVisible(index);
                // Přepnutí viditelnosti v grafu
                myChart.setDatasetVisibility(index, !isCurrentlyVisible);
                
                // Změna stylu tlačítka
                if (isCurrentlyVisible) {
                    btn.style.backgroundColor = 'transparent';
                    btn.style.color = ds.color; // Vypnuto = pouze barevný rámeček a text
                } else {
                    btn.style.backgroundColor = ds.color;
                    btn.style.color = 'white';  // Zapnuto = plná barva
                }
                myChart.update();
            };
            togglesContainer.appendChild(btn);
        });

        // --- 4. NAČTENÍ DAT Z THINGSPEAK PŘES PŘESNÝ ČAS ---
        async function loadHistory(hoursBack = 24) {
            if(tsConfig.channelID === 'VLOZTE_ID_KANALU') { console.log("Nenastaveno ID kanálu"); return; }
            
            myChart.options.plugins.title.text = 'Načítám data...';
            myChart.update('none');

            // Výpočet přesného času Od - Do
            const endDate = new Date();
            const startDate = new Date(endDate.getTime() - (hoursBack * 60 * 60 * 1000));

            // Fixace osy X v grafu. Tím zaručíme, že i když data v noci chybí, 
            // osa X bude ukazovat přesných X hodin zpětně a výpadek bude vidět jako díra.
            myChart.options.scales.x.min = startDate.getTime();
            myChart.options.scales.x.max = endDate.getTime();

            // Formátování času pro ThingSpeak API (vyžaduje ISO 8601 nebo specifický tvar)
            const startStr = startDate.toISOString();
            const endStr = endDate.toISOString();

            // Používáme parametry start a end místo results
            const url = `https://api.thingspeak.com/channels/${tsConfig.channelID}/feeds.json?api_key=${tsConfig.readKey}&start=${startStr}&end=${endStr}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                // Vyčistit stará data
                myChart.data.datasets.forEach(ds => ds.data = []);

                if (data.feeds) {
                    data.feeds.forEach(feed => {
                        const time = new Date(feed.created_at);
                        
                        datasetsConfig.forEach((ds, index) => {
                            const val = parseFloat(feed[ds.field]);
                            if(!isNaN(val)) {
                                myChart.data.datasets[index].data.push({x: time, y: val});
                            }
                        });
                    });
                    
                    myChart.options.plugins.title.text = `Historie za posledních ${hoursBack} hodin`;
                    myChart.update();
                }
            } catch (e) { 
                console.error("Chyba stahování historie:", e); 
                myChart.options.plugins.title.text = 'Chyba při načítání dat';
                myChart.update();
            }
        }

        // Funkce pro změnu rozsahu z tlačítek
        function changeRange(hours, btn) {
            document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            // Vymazat hodnotu z custom inputu, pokud uživatel klikne na předvolbu
            const customInput = document.getElementById('custom-hours');
            if(customInput) customInput.value = '';
            
            loadHistory(hours);
        }

        // Funkce pro vlastní rozsah hodin z inputu
        function applyCustomRange(btn) {
            const input = document.getElementById('custom-hours');
            let hours = parseInt(input.value);
            
            // Kontrola platnosti
            if (isNaN(hours) || hours <= 0) {
                input.style.borderColor = '#e74c3c'; // Červená barva při chybě
                setTimeout(() => input.style.borderColor = '#bdc3c7', 2000);
                return;
            }
            
            // Ochrana proti přetížení API (max 30 dní)
            if (hours > 720) {
                hours = 720;
                input.value = 720;
            }

            // Aktualizace vizuálu tlačítek
            document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            loadHistory(hours);
        }

        // Spustit načítání výchozího stavu (24h)
        loadHistory(24);

        // --- 5. MQTT LOGIKA (ŽIVÁ DATA) ---
        const heatingMap = {
            'pec': 'val-pec',
            'horni_n': 'val-horni_n',
            'stredni_n': 'val-stredni_n',
            'dolni_n': 'val-dolni_n',
            'horni_s': 'val-horni_s',
            'dolni_s': 'val-dolni_s',
            'solarni': 'val-solarni'
        };

        const mqttOptions = {
            protocol: 'wss',
            hostname: 'broker.emqx.io', 
            port: 8084,
            path: '/mqtt',
            clientId: 'WebMonitor_Heat_' + Math.random().toString(16).substr(2, 8)
        };

        const client = mqtt.connect(mqttOptions);
        const statusEl = document.getElementById('status');

        client.on('connect', () => {
            statusEl.innerHTML = '<span class="online">● Online - Kotelna</span>';
            Object.keys(heatingMap).forEach(topic => client.subscribe(topic));
        });

        client.on('message', (topic, message) => {
            if (heatingMap[topic]) {
                const msgVal = parseFloat(message.toString());
                const elementId = heatingMap[topic];
                const el = document.getElementById(elementId);
                
                if (el) {
                    el.innerText = msgVal.toFixed(1);
                    el.style.color = '#3498db';
                    setTimeout(() => el.style.color = '', 300);
                }
            }
        });

        client.on('error', (err) => { 
            console.error(err); 
            statusEl.innerText = 'Chyba spojení s MQTT'; 
            statusEl.style.color = 'red';
        });
    </script>
</body>
</html>
