<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel - Místnosti</title>
    <!-- Odkaz na sdílený CSS soubor -->
    <link rel="stylesheet" href="style.css?v=2.0">

    <!-- Knihovny pro graf (MQTT odstraněno) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.3.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1"></script>
    <!-- Knihovny pro dotyková gesta a Zoom/Pan v grafu -->
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
</head>

<body>

    <!-- NAVIGACE -->
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">Monitorovací Systém</a>
        <div class="nav-links">
            <a href="teplomer.html" class="nav-btn active">Místnosti</a>
            <a href="kotelna.html" class="nav-btn">Kotelna</a>
        </div>
    </nav>

    <div class="container">
        <!-- Status bar pro informaci o poslední aktualizaci -->
        <div id="status" style="text-align: center; color: #7f8c8d; font-size: 0.9rem;">
            Načítám data...
        </div>
        <br>

        <!-- GRID PRO KARTY MÍSTNOSTÍ -->
        <div id="dashboard-rooms" class="dashboard-grid">
            <!-- Karty se generují automaticky přes JS -->
        </div>

        <!-- GRAF -->
        <div class="chart-container" style="padding-bottom: 30px; height: auto;">

            <!-- Přepínače zobrazených hodnot v grafu -->
            <div id="dataset-toggles" class="chart-controls" style="margin-bottom: 20px;">
                <!-- Tlačítka se vygenerují automaticky přes JS -->
            </div>

            <!-- Ovládací tlačítka pro časové období a Zoom -->
            <div class="chart-controls">
                <button onclick="changeRange(6, this)" class="range-btn">6h</button>
                <button onclick="changeRange(12, this)" class="range-btn">12h</button>
                <button onclick="changeRange(24, this)" class="range-btn active">24h</button>
                <button onclick="changeRange(72, this)" class="range-btn">3 Dny</button>
                <span style="color: #bdc3c7; margin: 0 5px;" class="desktop-only">|</span>
                <input type="number" id="custom-hours" class="range-input" placeholder="Hodin..." min="1" max="720">
                <button onclick="applyCustomRange(this)" class="range-btn">Použít</button>
                <button onclick="resetChartZoom()" class="range-btn reset-btn">Reset Zoomu</button>
                <button id="toggle-tooltip-btn" onclick="toggleTooltip()" class="range-btn tooltip-btn">Vypnout
                    Tooltip</button>
            </div>

            <p style="text-align: center; font-size: 0.75rem; color: #95a5a6; margin-top: -5px; margin-bottom: 10px;">
                💡 Tip: V grafu můžete scrollovat kolečkem myši pro přiblížení a tažením se posouvat (na mobilu gesty).
            </p>

            <div style="position: relative; height: 340px;">
                <canvas id="tempChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // --- 1. KONFIGURACE THINGSPEAK ---
        // ZDE ZADEJTE SVÉ ÚDAJE
        const tsConfig = {
            channelID: '3011617',
            readKey: 'BMX38S8R8XSRK5YR'
        };

        // --- 2. KONFIGURACE SENZORŮ PRO MÍSTNOSTI ---
        const senzorKonfig = [
            {
                id: 'obyvak',
                nazev: 'Vojta Pokoj',
                fieldTemp: 'field1', // Teplota
                fieldHum: 'field2',  // Vlhkost (dle zadání)
                color: '#3498db'
            }
            // Zde můžete přidat další místnosti
        ];

        // --- 3. GENERUJ HTML KARTY ---
        const dashboardRooms = document.getElementById('dashboard-rooms');
        senzorKonfig.forEach(senzor => {
            const html = `
                <div class="card" style="border-top-color: ${senzor.color}">
                    <span class="card-icon">🏠</span>
                    <h2>${senzor.nazev}</h2>
                    <div class="data-row">
                        <span class="data-label">Teplota</span>
                        <div><span id="val-temp-${senzor.id}" class="data-value">--</span> <span class="data-unit">°C</span></div>
                    </div>
                    <div class="data-row">
                        <span class="data-label">Vlhkost</span>
                        <div><span id="val-hum-${senzor.id}" class="data-value">--</span> <span class="data-unit">%</span></div>
                    </div>
                </div>
            `;
            dashboardRooms.innerHTML += html;
        });

        // --- 4. INICIALIZACE GRAFU ---
        const ctx = document.getElementById('tempChart').getContext('2d');
        const myChart = new Chart(ctx, {
            type: 'line',
            data: {
                datasets: senzorKonfig.map(s => ({
                    label: s.nazev,
                    borderColor: s.color,
                    backgroundColor: s.color,
                    data: [],
                    tension: 0.4,
                    borderWidth: 2,
                    pointRadius: 0,
                    pointHitRadius: 10
                }))
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'nearest',
                    axis: 'x',
                    intersect: false
                },
                scales: {
                    x: {
                        type: 'time',
                        time: { unit: 'hour', tooltipFormat: 'dd.MM. yyyy HH:mm' },
                        title: { display: true, text: 'Čas' }
                    },
                    y: { suggestedMin: 18, suggestedMax: 28, title: { display: true, text: 'Teplota (°C)' } }
                },
                plugins: {
                    title: { display: true, text: 'Vývoj teplot' },
                    tooltip: { mode: 'index', intersect: false },
                    zoom: {
                        pan: {
                            enabled: true,
                            mode: 'x',
                            onPanComplete: checkAndLoadMoreData
                        },
                        zoom: {
                            wheel: { enabled: true },
                            pinch: { enabled: true },
                            mode: 'x',
                            onZoomComplete: checkAndLoadMoreData
                        }
                    }
                }
            }
        });

        function resetChartZoom() {
            if (myChart) myChart.resetZoom();
        }

        function toggleTooltip() {
            const currentState = myChart.options.plugins.tooltip.enabled;
            const isCurrentlyEnabled = currentState !== false;

            myChart.options.plugins.tooltip.enabled = !isCurrentlyEnabled;
            myChart.update('none');

            const btn = document.getElementById('toggle-tooltip-btn');
            if (!isCurrentlyEnabled) {
                btn.innerText = 'Vypnout Tooltip';
                btn.style.backgroundColor = '#f39c12';
                btn.style.borderColor = '#f39c12';
            } else {
                btn.innerText = 'Zapnout Tooltip';
                btn.style.backgroundColor = '#bdc3c7';
                btn.style.borderColor = '#bdc3c7';
            }
        }

        let loadedStartTime = new Date().getTime();

        function checkAndLoadMoreData({ chart }) {
            const currentMin = chart.scales.x.min;
            if (currentMin < loadedStartTime - (3600 * 1000)) {
                const now = new Date().getTime();
                let hoursNeeded = Math.ceil((now - currentMin) / (1000 * 60 * 60));

                hoursNeeded += 12;
                if (hoursNeeded > 720) hoursNeeded = 720;

                const currentLoadedHours = Math.ceil((now - loadedStartTime) / (1000 * 60 * 60));

                if (hoursNeeded > currentLoadedHours) {
                    console.log(`Posun grafu: donačítám ${hoursNeeded}h historie...`);
                    loadHistory(hoursNeeded, true);
                }
            }
        }

        // Generování tlačítek pro filtrování dat
        const togglesContainer = document.getElementById('dataset-toggles');
        senzorKonfig.forEach((s, index) => {
            const btn = document.createElement('button');
            btn.className = 'toggle-btn';
            btn.style.borderColor = s.color;
            btn.style.backgroundColor = s.color;
            btn.style.color = 'white';
            btn.innerText = s.nazev;

            btn.onclick = () => {
                const isCurrentlyVisible = myChart.isDatasetVisible(index);
                myChart.setDatasetVisibility(index, !isCurrentlyVisible);

                if (isCurrentlyVisible) {
                    btn.style.backgroundColor = 'transparent';
                    btn.style.color = s.color;
                } else {
                    btn.style.backgroundColor = s.color;
                    btn.style.color = 'white';
                }
                myChart.update();
            };
            togglesContainer.appendChild(btn);
        });

        // --- 5. NAČÍTÁNÍ DAT (REST API) ---
        let initialLoadDone = false;

        async function loadHistory(hoursBack = 24, preserveZoom = false) {
            if (tsConfig.channelID === 'VLOZTE_CHANNEL_ID') {
                document.getElementById('status').innerText = 'Chybí nastavení Channel ID!';
                document.getElementById('status').style.color = 'red';
                return;
            }

            if (!preserveZoom) {
                myChart.options.plugins.title.text = 'Načítám data...';
                myChart.update('none');
            }

            const endDate = new Date();
            const startDate = new Date(endDate.getTime() - (hoursBack * 60 * 60 * 1000));

            if (!preserveZoom) {
                myChart.options.scales.x.min = startDate.getTime();
                myChart.options.scales.x.max = endDate.getTime();
            }

            const startStr = startDate.toISOString();
            const endStr = endDate.toISOString();

            const url = `https://api.thingspeak.com/channels/${tsConfig.channelID}/feeds.json?api_key=${tsConfig.readKey}&start=${startStr}&end=${endStr}`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.feeds && data.feeds.length > 0) {
                    // 1. Vymazání starých dat v grafu
                    myChart.data.datasets.forEach(ds => ds.data = []);

                    // 2. Naplnění grafu historií
                    data.feeds.forEach(feed => {
                        const time = new Date(feed.created_at);
                        senzorKonfig.forEach((senzor, index) => {
                            const val = parseFloat(feed[senzor.fieldTemp]);
                            if (!isNaN(val)) {
                                myChart.data.datasets[index].data.push({ x: time, y: val });
                            }
                        });
                    });

                    myChart.options.plugins.title.text = `Vývoj teplot (posledních ${hoursBack} hodin)`;
                    myChart.update(preserveZoom ? 'none' : undefined);

                    loadedStartTime = startDate.getTime();

                    if (initialLoadDone && !preserveZoom) {
                        resetChartZoom();
                    }
                    initialLoadDone = true;

                    // 3. Aktualizace číselných hodnot z POSLEDNÍHO záznamu
                    const lastFeed = data.feeds[data.feeds.length - 1];
                    const lastUpdate = new Date(lastFeed.created_at);

                    senzorKonfig.forEach(senzor => {
                        const temp = parseFloat(lastFeed[senzor.fieldTemp]);
                        const hum = parseFloat(lastFeed[senzor.fieldHum]);

                        const elTemp = document.getElementById(`val-temp-${senzor.id}`);
                        const elHum = document.getElementById(`val-hum-${senzor.id}`);

                        if (!isNaN(temp)) elTemp.innerText = temp.toFixed(1);
                        if (!isNaN(hum)) elHum.innerText = hum.toFixed(0);
                    });

                    // Aktualizace statusu
                    document.getElementById('status').innerHTML =
                        `Poslední aktualizace: ${lastUpdate.toLocaleTimeString()} (REST API)`;
                    document.getElementById('status').style.color = '#7f8c8d';

                } else {
                    document.getElementById('status').innerText = 'Žádná data k dispozici.';
                    if (!preserveZoom) {
                        myChart.options.plugins.title.text = 'Žádná data';
                        myChart.update();
                    }
                }
            } catch (error) {
                console.error("Chyba při načítání dat:", error);
                document.getElementById('status').innerText = 'Chyba připojení k ThingSpeak API.';
                document.getElementById('status').style.color = 'red';
                if (!preserveZoom) {
                    myChart.options.plugins.title.text = 'Chyba při načítání dat';
                    myChart.update();
                }
            }
        }

        function changeRange(hours, btn) {
            document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const customInput = document.getElementById('custom-hours');
            if (customInput) customInput.value = '';

            loadHistory(hours);
        }

        function applyCustomRange(btn) {
            const input = document.getElementById('custom-hours');
            let hours = parseInt(input.value);

            if (isNaN(hours) || hours <= 0) {
                input.style.borderColor = '#e74c3c';
                setTimeout(() => input.style.borderColor = '#bdc3c7', 2000);
                return;
            }

            if (hours > 720) {
                hours = 720;
                input.value = 720;
            }

            document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            loadHistory(hours);
        }

        // Spustit hned po načtení
        loadHistory(24);

        // Automatická aktualizace každou minutu (60000 ms)
        setInterval(() => {
            const activeBtn = document.querySelector('.range-btn.active');
            let hours = 24;
            if (activeBtn) {
                if (activeBtn.innerText === '6h') hours = 6;
                else if (activeBtn.innerText === '12h') hours = 12;
                else if (activeBtn.innerText === '24h') hours = 24;
                else if (activeBtn.innerText === '3 Dny') hours = 72;
                else if (activeBtn.innerText === 'Použít') hours = parseInt(document.getElementById('custom-hours').value) || 24;
            }
            loadHistory(hours, true);
        }, 60000);

    </script>
</body>

</html>
